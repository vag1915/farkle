<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu de Farkle</title>
<style>
/* Un écran noir plein cadre. Engrenage à gauche, scores à droite, piste ronde verte entre le gobelet et le panneau STOP. Tout le texte est en Arial gras, blanc sur noir. L'élément actif aux flèches est entouré de jaune. */
:root {
  --noir: #000;
  --blanc: #fff;
  --rouge: #d90012;
  --piste: #14793b;
  --rail: #0a4a22;
  --focus: #ffe600;
  --police: Arial, Helvetica, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--noir);
  color: var(--blanc);
  font: 700 18px/1.45 var(--police);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: 700 18px var(--police); color: var(--blanc); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nav:focus { outline: 6px solid var(--focus); outline-offset: 3px; }
.nav:focus:not(:focus-visible) { outline: 6px solid var(--focus); outline-offset: 3px; }
body.sans-cadre .nav:focus { outline: none; }
.saisie { width: 100%; font: 700 20px var(--police); color: var(--blanc); background: var(--noir); border: 3px solid var(--blanc); border-radius: 12px; padding: 12px 18px; min-height: 58px; }

.ecran { height: 100%; max-width: 900px; margin: 0 auto; background: var(--noir); display: flex; flex-direction: column; overflow: hidden; }
.vue { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.centre { align-items: center; justify-content: center; padding: 16px; }
.haut { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 4px; }
.scores { font-size: 15px; text-align: right; line-height: 1.5; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ligne-score { padding: 1px 6px; border-radius: 6px; }
.engrenage { background: none; border: 0; padding: 4px; width: 56px; height: 56px; border-radius: 10px; flex: none; }
.engrenage svg { width: 100%; height: 100%; display: block; }

.gros { background: radial-gradient(ellipse at 50% 18%, #ff8f8f 0%, #d90012 48%, #8f000d 100%); color: var(--blanc); border: 0; border-radius: 50%; padding: 52px 28px; width: min(100%, 420px); font-size: clamp(24px, 6vw, 34px); letter-spacing: 0.03em; box-shadow: 0 9px 0 #5a0008, 0 16px 20px rgba(0, 0, 0, 0.8), inset 0 5px 8px rgba(255, 255, 255, 0.5), inset 0 -8px 12px rgba(0, 0, 40, 0.45); transition: transform 0.08s, box-shadow 0.08s; }
.gros small { display: block; font-size: 16px; letter-spacing: 0; font-weight: 700; margin-top: 2px; }
.gros:active { transform: translateY(6px); box-shadow: 0 3px 0 #5a0008, 0 6px 8px rgba(0, 0, 0, 0.8), inset 0 5px 8px rgba(255, 255, 255, 0.5), inset 0 -8px 12px rgba(0, 0, 40, 0.45); }

#v-partie { justify-content: center; gap: 10px; padding-bottom: 12px; container-type: size; }
.infos { text-align: center; padding: 0 12px; }
.tour { font-size: 17px; }
.score-tour { font-size: 38px; line-height: 1.1; display: inline-block; padding: 0 14px; border-radius: 8px; }
.rail { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 12px; }
.piste { position: relative; flex: none; aspect-ratio: 1 / 1; height: max(150px, min(60vh, 320px)); border: 7px solid var(--rail); border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #1b9248 0%, var(--piste) 55%, #0e5a2b 100%); box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.55); }
@supports (width: 1cqh) {
  .piste { height: max(150px, calc(100cqh - 200px)); }
}
.zone { position: absolute; inset: 0; }
.ico { background: none; border: 0; padding: 0; width: 84px; height: 84px; flex: none; border-radius: 14px; }
.ico svg { width: 100%; height: 100%; display: block; }
.message { min-height: 40px; text-align: center; font-size: 20px; padding: 0 16px; }

.de { position: absolute; left: 0; top: 0; width: var(--sz, 40px); height: var(--sz, 40px); background: var(--noir); border: 2px solid #555; border-radius: 18%; padding: 0; display: block; appearance: none; transition: transform 0.17s ease-out; }
.de svg { width: 100%; height: 100%; display: block; pointer-events: none; }
#stop svg { filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.8)); transition: transform 0.08s; }
#stop:active svg { transform: translateY(3px) scale(0.97); }
.de.kept, .de.locked { background: #8a0f1c; border-color: #c0505c; }
.de.locked { opacity: 0.75; }
.de.off { display: none; }
.de:focus { outline-offset: 5px; }

.corps { flex: 1; min-height: 0; overflow: auto; padding: 12px 4px; display: flex; flex-direction: column; gap: 12px; }
.corps h2 { font-size: 26px; margin: 0; }
.btn { background: var(--noir); border: 3px solid var(--blanc); border-radius: 12px; padding: 12px 18px; min-height: 58px; }
.btn:active { background: var(--blanc); color: var(--noir); }
.reglage { width: 100%; text-align: left; }
.bas { padding: 10px 4px 8px; }
.ok { width: 100%; }
.liste { display: flex; flex-direction: column; gap: 8px; font-size: 20px; }
.liste > div { padding: 4px 8px; border-radius: 8px; }
.info-fin { font-size: 20px; text-align: center; padding: 6px 8px; border-radius: 8px; }
.gagnant { font-size: clamp(28px, 7vw, 42px); text-align: center; text-transform: uppercase; padding: 20px 8px; line-height: 1.15; border-radius: 10px; }

@media (max-width: 640px) {
  .rail { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "piste piste" "gobelet stop"; gap: 10px 16px; justify-items: center; padding: 0 12px; }
  .rail .piste { grid-area: piste; width: 100%; aspect-ratio: 1 / 1; height: auto; max-height: none; }
  #gobelet { grid-area: gobelet; }
  #stop { grid-area: stop; }
}
@supports (width: 1cqh) {
  @media (max-width: 640px) {
    .rail .piste { width: min(100%, max(200px, calc(100cqh - 240px))); }
  }
}
@media (prefers-reduced-motion: reduce) {
  .de { transition: none; }
}
</style>

</head>
<body>
<div class="ecran" id="ecran">
  <div class="haut" id="haut">
    <button class="engrenage nav" id="engrenage" type="button" aria-label="Paramètres" data-parle="Paramètres">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g fill="#fff">
          <circle cx="24" cy="24" r="14"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(45 24 24)"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(90 24 24)"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(135 24 24)"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(180 24 24)"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(225 24 24)"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(270 24 24)"/>
          <rect x="20.5" y="3" width="7" height="12" rx="1.5" transform="rotate(315 24 24)"/>
        </g>
        <circle cx="24" cy="24" r="6" fill="#000"/>
      </svg>
    </button>
    <div class="scores" id="scores"></div>
  </div>

  <div class="vue centre" id="v-accueil">
    <button class="gros nav" id="nouvelle" type="button" aria-label="Nouvelle partie" data-parle="Nouvelle partie">NOUVELLE PARTIE</button>
  </div>

  <div class="vue" id="v-partie" hidden>
    <div class="infos">
      <div class="tour" id="tour-de"></div>
      <div class="score-tour nav" id="score-tour" tabindex="0" role="group" aria-label="Score 0" data-parle="Score 0">0</div>
    </div>
    <div class="rail">
      <button class="ico nav" id="gobelet" type="button" aria-label="Lancer" data-parle="Lancer">
        <svg viewBox="0 0 60 76" aria-hidden="true">
          <defs>
            <linearGradient id="g-corps" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#0a655e"/><stop offset="0.2" stop-color="#34e6d4"/><stop offset="0.45" stop-color="#21c8b8"/><stop offset="0.8" stop-color="#11897e"/><stop offset="1" stop-color="#064c46"/>
            </linearGradient>
            <linearGradient id="g-int" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#022b27"/><stop offset="1" stop-color="#0d8e82"/>
            </linearGradient>
          </defs>
          <path d="M7 15 L53 15 L45.5 67 A15.5 4 0 0 1 14.5 67 Z" fill="url(#g-corps)"/>
          <path d="M10.6 32 Q30 38.5 49.4 32" fill="none" stroke="#06524c" stroke-width="2.2" stroke-opacity="0.6"/>
          <path d="M10.6 34 Q30 40.5 49.4 34" fill="none" stroke="#fff" stroke-width="0.9" stroke-opacity="0.3"/>
          <path d="M12.2 47 Q30 53 47.8 47" fill="none" stroke="#06524c" stroke-width="2.2" stroke-opacity="0.6"/>
          <path d="M12.2 49 Q30 55 47.8 49" fill="none" stroke="#fff" stroke-width="0.9" stroke-opacity="0.3"/>
          <path d="M14.5 21 L19 62" fill="none" stroke="#fff" stroke-width="3.4" stroke-opacity="0.4" stroke-linecap="round"/>
          <ellipse cx="30" cy="15" rx="23" ry="6.2" fill="#1aa99c" stroke="#fff" stroke-width="2"/>
          <ellipse cx="30" cy="15.5" rx="19.8" ry="4.6" fill="url(#g-int)"/>
          <path d="M11 13.6 Q30 8.6 49 13.6" fill="none" stroke="#fff" stroke-width="1.1" stroke-opacity="0.55" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="piste"><div class="zone" id="zone"></div></div>
      <button class="ico nav" id="stop" type="button" aria-label="Valider" data-parle="Valider">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="v-coche" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9dffb8"/><stop offset="0.45" stop-color="#25c85a"/><stop offset="1" stop-color="#0a7a30"/>
            </linearGradient>
          </defs>
          <path d="M9 34 L25 50 L55 13" fill="none" stroke="#1c5a30" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 5)"/>
          <path d="M9 34 L25 50 L55 13" fill="none" stroke="#0b6a2a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2)"/>
          <path d="M9 34 L25 50 L55 13" fill="none" stroke="url(#v-coche)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 34 L25 50 L55 13" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1 -3)"/>
        </svg>
      </button>
    </div>
    <div class="message" id="message"></div>
  </div>

  <div class="vue" id="v-reglages" hidden>
    <div class="corps">
      <h2>Paramètres</h2>
      <div id="r-liste" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>
    <div class="bas"><button class="btn ok nav" id="ok-reglages" type="button" aria-label="OK" data-parle="OK">OK</button></div>
  </div>

  <div class="vue" id="v-fin" hidden>
    <div class="corps">
      <div class="liste" id="liste-fin"></div>
      <div class="gagnant nav" id="gagnant" tabindex="0" role="group"></div>
      <div class="info-fin nav" id="info-fin" tabindex="0" role="group" hidden></div>
    </div>
    <div class="bas"><button class="btn ok nav" id="ok-fin" type="button" aria-label="OK" data-parle="OK">OK</button></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const rnd = (n) => Math.floor(Math.random() * n);
  const RAPIDE = !!window.__rapide;
  const reduit = RAPIDE || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  /* Chaque élément garde son propre écouteur : c'est ce qui permet au bouton OK du SensePlayer de l'activer. */
  function surClic(el, fn) { el.addEventListener('click', fn); }
  const attendre = (ms) => (RAPIDE ? Promise.resolve() : new Promise(function (r) { setTimeout(r, ms); }));

  /* =====================================================================
     SONS (synthèse Web Audio)
     ===================================================================== */
  let AC = null, master = null, noiseBuf = null, fxIn = null;
  const suivis = [];
  function ac() {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      AC = new C();
      const comp = AC.createDynamicsCompressor();
      master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(comp);
      comp.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      if (natif()) {
        ['createGain', 'createBiquadFilter', 'createStereoPanner', 'createOscillator', 'createBufferSource'].forEach(function (k) {
          if (!AC[k]) return;
          const f = AC[k].bind(AC);
          AC[k] = function () { const n = f.apply(null, arguments); suivis.push(n); return n; };
        });
      }
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (AC.createConvolver && !natif()) {
        const conv = AC.createConvolver();
        const len = Math.floor(AC.sampleRate * (natif() ? 0.8 : 1.5));
        const ir = AC.createBuffer(2, len, AC.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const c2 = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) c2[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        }
        conv.buffer = ir;
        fxIn = AC.createGain();
        const wet = AC.createGain();
        wet.gain.value = 0.3;
        fxIn.connect(conv); conv.connect(wet); wet.connect(master);
      }
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function jouer(fn, arg) {
    if (RAPIDE) return;
    try {
      ac();
      const d0 = suivis.length;
      fn(arg);
      if (suivis.length > d0) {
        const lot = suivis.splice(d0);
        setTimeout(function () { lot.forEach(function (n) { try { n.disconnect(); } catch (e) { /* rien */ } }); }, 12000);
      }
    } catch (e) { /* son indisponible */ }
  }
  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function sendFx(node, amount) {
    if (!fxIn) return;
    const s = AC.createGain();
    s.gain.value = amount;
    node.connect(s); s.connect(fxIn);
  }
  function noiseHit(t, f, q, peak, dur) {
    const s = AC.createBufferSource();
    s.buffer = noiseBuf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const g = AC.createGain();
    env(g, t, 0.002, peak, dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5, dur + 0.02);
  }
  function tone(t, f0, f1, type, peak, dur, a, wet) {
    const o = AC.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain();
    env(g, t, a || 0.005, peak, dur);
    o.connect(g); g.connect(master);
    if (wet) sendFx(g, wet);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function toc(t, f0, f1, peak, dur) { tone(t, f0, f1, 'sine', peak, dur, 0.003); }
  function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function sortie(pan, dest) {
    dest = dest || master;
    if (AC.createStereoPanner) {
      const p = AC.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      p.connect(dest);
      return p;
    }
    return dest;
  }
  function impact(t, a, pan, brillance) {
    const out = sortie(pan);
    const s = AC.createBufferSource();
    s.buffer = noiseBuf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = (1500 + Math.random() * 2500) * brillance;
    bp.Q.value = 0.9;
    const g = AC.createGain();
    env(g, t, 0.0015, a, 0.02 + Math.random() * 0.02);
    s.connect(bp); bp.connect(g); g.connect(out);
    s.start(t, Math.random() * 0.5, 0.06);
    const o = AC.createOscillator();
    o.type = 'sine';
    const f = (320 + Math.random() * 500) * (brillance > 1.2 ? 1.6 : 1);
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.05);
    const g2 = AC.createGain();
    env(g2, t, 0.001, a * 0.7, 0.05);
    o.connect(g2); g2.connect(out);
    o.start(t); o.stop(t + 0.07);
  }
  function piano(t, midi, vel, dur) {
    const f = midiHz(midi);
    const lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(9000, 1200 + f * 3 + vel * 3000);
    lp.Q.value = 0.4;
    const mix = AC.createGain();
    mix.gain.value = 0.2;
    mix.connect(lp); lp.connect(master); sendFx(lp, 0.5);
    const partiels = [];
    for (let k = 1; k <= 6; k++) {
      const fk = f * k * Math.sqrt(1 + 0.0004 * k * k);
      if (fk < 12000) partiels.push([fk, vel / Math.pow(k, 1.15), dur / (1 + 0.55 * (k - 1))]);
    }
    partiels.push([f * 1.0018, vel * 0.5, dur]);
    partiels.forEach(function (p) {
      const o = AC.createOscillator();
      o.type = 'sine'; o.frequency.value = p[0];
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p[1], t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
      o.connect(g); g.connect(mix);
      o.start(t); o.stop(t + p[2] + 0.05);
    });
    noiseHit(t, Math.min(5000, f * 4), 1.2, 0.05 * vel, 0.02);
  }
  /* Lancer : arpège descendant au piano, une note par dé lancé. */
  function sonLancer(n) {
    const t = AC.currentTime + 0.02;
    const gamme = [91, 88, 84, 79, 76, 72];
    for (let i = 0; i < n; i++) {
      const dernier = i === n - 1;
      piano(t + i * 0.085, gamme[i], 0.95 - 0.35 * (i / 5), dernier ? 1.8 : 1.1);
    }
  }
  function cuivre(t, midi, vel, dur) {
    const f = midiHz(midi);
    const lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 1;
    lp.frequency.setValueAtTime(500, t);
    lp.frequency.linearRampToValueAtTime(2800, t + Math.min(0.12, dur * 0.4));
    lp.frequency.linearRampToValueAtTime(1500, t + dur);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel * 0.22, t + 0.03);
    g.gain.setValueAtTime(vel * 0.22, t + Math.max(0.04, dur - 0.12));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    [0, 7, -7].forEach(function (c) {
      const o = AC.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    });
    lp.connect(g); g.connect(master); sendFx(g, 0.4);
  }
  function carillon(t, midi, vel, dur) {
    const f = midiHz(midi);
    [[1, 1, dur], [2.76, 0.4, dur * 0.5], [5.4, 0.2, dur * 0.25]].forEach(function (p) {
      tone(t, f * p[0], f * p[0], 'sine', vel * 0.3 * p[1], p[2], 0.002, 0.5);
    });
  }
  function harpe(t, midi, vel, dur) {
    const f = midiHz(midi);
    tone(t, f, f, 'triangle', vel * 0.3, dur, 0.002, 0.45);
    tone(t, f * 2, f * 2, 'sine', vel * 0.1, dur * 0.5, 0.002, 0.3);
    noiseHit(t, Math.min(6000, f * 3), 2, vel * 0.04, 0.012);
  }
  function sonVictoire() {
    const t = AC.currentTime + 0.05;
    [[67, 0, 0.14], [72, 0.15, 0.14], [76, 0.3, 0.14], [79, 0.45, 0.5], [76, 1.0, 0.14], [79, 1.15, 0.14], [84, 1.3, 1.7]].forEach(function (n) {
      cuivre(t + n[1], n[0], 0.9, n[2]);
    });
    [60, 64, 67, 72].forEach(function (m) { cuivre(t + 1.3, m, 0.55, 1.7); });
    [[0.45, 0.8], [1.3, 1.0]].forEach(function (p) {
      toc(t + p[0], 110, 50, p[1] * 0.8, 0.35);
      noiseHit(t + p[0], 250, 0.8, 0.3, 0.1);
    });
    noiseHit(t + 1.3, 8000, 1.0, 0.1, 0.45);
  }
  function sonGarder() {
    const t = AC.currentTime + 0.01;
    tone(t, 640, 300, 'sine', 0.5, 0.09);
    noiseHit(t, 3200, 3, 0.25, 0.03);
  }
  function trombone(t, f0, f1, dur, vib) {
    const o = AC.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t);

  }

  /* =====================================================================

  /* Espérance du score d'un tour, calculée une fois (programmation dynamique) pour les niveaux Pro et Expert. */
  const DP = { tab: null, memo: null };

  function prepDP() {
    if (DP.tab) return;

    DP.tab = [null];
    DP.memo = [new Map(), new Map()];
    for (let n = 1; n <= 6; n++) {
      const liste = [];
      const c = [0, 0, 0, 0, 0, 0, 0];
      const creer = function () {
        const vals = [];

        for (let f = 1; f <= 6; f++) {

  /* ---------- Déroulement d'un tour ---------- */

        dire('Tour de ' + nom(G.cur) + (dt ? '. Dernier tour' : '') + '. Lancer.');
      }
    }
  }

  async function farkle(tk) {
    G.busy = true;
    const i = G.cur;
    jouer(sonFarkle);
    G.farkles[i]++;
    let triple = false;
    if (G.farkles[i] >= 3) { G.scores[i] -= 1000; G.farkles[i] = 0; triple = true; }
    G.bank = 0;
    majScores();
    majScoreTour(0);
    msg(triple ? '3 FARKLES D’AFFILÉE : MOINS 1000 POINTS' : 'FARKLE !');
    await attendre(1700);
    if (!vivant(tk)) return;
    await dire((triple ? 'Farkle. Trois farkles d’affilée, moins mille points. ' : 'Farkle. ') + resume(i));
    if (!vivant(tk)) return;
    await attendre(300);
    if (!vivant(tk)) return;
    suivant();
  }

  async function banque(tk) {
    G.busy = true;
    const i = G.cur, gain = turnScore();
    jouer(sonStop);
    G.scores[i] += gain;
    G.farkles[i] = 0;
    majScores();
    majScoreTour(gain);
    msg(nom(i) + ' : ' + G.scores[i] + ' points');
    await attendre(900);
    if (!vivant(tk)) return;
    await dire(nom(i) + ', ' + nombre(G.scores[i]) + ' points.');
    if (!vivant(tk)) return;
    if (G.scores[i] >= 10000 && G.dernier === null) {
      G.dernier = i;
      if (reg.nb === 1) { await finPartie(tk); return; }
      msg('DERNIER TOUR POUR LES AUTRES JOUEURS');
      await dire(nom(i) + ' a atteint dix mille points. Dernier tour pour les autres joueurs.');
      if (!vivant(tk)) return;
    }
    await attendre(300);
    if (!vivant(tk)) return;
    suivant();
  }

  /* Tous les dés libres sont gardés : on met le score de côté puis les six dés sont relancés. */
  async function relanceAuto(tk) {
    G.busy = true;
    const k = gardes();
    G.bank += scoreOf(valeurs(k));
    k.forEach(function (i) { dice[i].locked = true; dice[i].el.classList.add('locked'); });
    majScoreTour();
    await attendre(350);
    if (!vivant(tk)) return;
    jouer(sonTousGardes);
    msg('Tous les dés sont gardés !');
    await attendre(2500);
    if (!vivant(tk)) return;
    reinitDes();
    msg('');
  }

  async function lancerHumain(idx, tk) {
    await lancer(idx, tk);
    if (!vivant(tk)) return;
    if (scoreOf(valeurs(libres())) === 0) { await farkle(tk); return; }
    G.busy = false;
    majScoreTour();
    dire(chiffres(valeurs(idx)));
  }

  function feedback(texte) { msg(texte); dire(texte); }

  function actionGobelet() {
    try { if (!RAPIDE) ac(); } catch (e) { /* sans son */ }
    if (G.busy || !G.enCours) return;
    const tk = G.token;
    if (!G.started) {
      G.started = true; G.bank = 0;
      lancerHumain(libres(), tk).catch(function () { });
      return;
    }
    const k = gardes();
    if (!valide(valeurs(k))) { feedback('Gardez au moins un dé qui marque des points.'); return; }
    G.bank += scoreOf(valeurs(k));
    k.forEach(function (i) { dice[i].locked = true; dice[i].el.classList.add('locked'); majDe(i); });
    majScoreTour();
    lancerHumain(libres(), tk).catch(function () { });
  }
  function actionStop() {
    try { if (!RAPIDE) ac(); } catch (e) { /* sans son */ }
    if (G.busy || !G.enCours) return;
    if (!G.started) { feedback('Lancez d’abord les dés.'); return; }
    if (!valide(valeurs(gardes()))) { feedback('Gardez au moins un dé qui marque des points.'); return; }
    banque(G.token).catch(function () { });
  }
  function toutGarde() {
    const l = libres(), k = gardes();
    return l.length > 0 && k.length === l.length && valide(valeurs(k));
  }
  function actionDe(i) {
    try { if (!RAPIDE) ac(); } catch (e) { /* sans son */ }
    const d = dice[i];
    if (G.busy || !G.started || d.locked || d.el.classList.contains('off')) return;
    d.kept = !d.kept;
    d.el.classList.toggle('kept', d.kept);
    majDe(i);
    if (d.kept) jouer(sonGarder);
    majScoreTour();
    if (d.kept && toutGarde()) {
      const tk = G.token;
      if (scoreOf(valeurs(gardes())) >= 10000) { banque(tk).catch(function () { }); return; }
      G.busy = true;
      const sc = G.bank + scoreOf(valeurs(gardes()));
      dire('Score ' + nombre(sc)).then(function () { if (vivant(tk)) return relanceAuto(tk); })
        .then(function () { if (vivant(tk)) return lancerHumain(libres(), tk); }).catch(function () { });
      return;
    }
    dire('Score ' + nombre(turnScore()));
  }

  /* ---------- Tour d'un robot ---------- */
  async function tourRobot(tk) {
    const p = reg.joueurs[G.cur], nomJ = nom(G.cur);
    G.started = true; G.bank = 0;
    let idx = libres();
    for (;;) {
      await lancer(idx, tk);
      if (!vivant(tk)) return;
      const lib = libres(), vals = valeurs(lib);
      if (scoreOf(vals) === 0) { await farkle(tk); return; }
      await dire(chiffres(valeurs(idx)));
      if (!vivant(tk)) return;
      await attendre(300);
      if (!vivant(tk)) return;
      const pen = G.farkles[G.cur] === 2 ? 1 : 0;
      const dec = decider(p.niveau, vals, G.bank, pen, G.scores[G.cur], G.dernier !== null ? meilleurScore() : null);
      const choisis = lib.filter(function (_, j) { return dec.m & (1 << j); });
      for (let q = 0; q < choisis.length; q++) {
        const i = choisis[q];
        dice[i].kept = true;
        dice[i].el.classList.add('kept');
        majDe(i);
        jouer(sonGarder);
        majScoreTour();
        await attendre(350);
        if (!vivant(tk)) return;
      }
      const hot = choisis.length === lib.length;
      if (hot && scoreOf(valeurs(choisis)) >= 10000) {
        await dire(nomJ + ' garde six dés identiques.');
        if (!vivant(tk)) return;
        await banque(tk);
        return;
      }
      await dire(nomJ + ' garde ' + chiffres(valeurs(choisis)) + '. Score ' + nombre(turnScore()) + '.');
      if (!vivant(tk)) return;
      if (hot) {
        await relanceAuto(tk);
        if (!vivant(tk)) return;
        idx = libres();
        continue;
      }
      if (dec.stop) {
        await dire(nomJ + ' s’arrête.');
        if (!vivant(tk)) return;
        await banque(tk);
        return;
      }
      choisis.forEach(function (i) { dice[i].locked = true; dice[i].el.classList.add('locked'); majDe(i); });
      G.bank += scoreOf(valeurs(choisis));
      idx = libres();
      await attendre(300);
      if (!vivant(tk)) return;
    }
  }

  /* ---------- Fin de partie ---------- */
  function classement() {
    const l = [];
    for (let i = 0; i < reg.nb; i++) l.push({ n: nom(i), s: G.scores[i], i: i });
    l.sort(function (a, b) { return b.s - a.s || a.i - b.i; });

  function construireFin() {
    const l = classement();

  async function finPartie(tk) {
    G.enCours = false; G.busy = true;
    const l = classement();
    construireFin();
    const inf = $('info-fin'), okb = $('ok-fin');
    let vocal = '';
    inf.hidden = true; defiSuite = false;
    okb.textContent = 'OK'; lab(okb, 'OK');

      const gagne = l[0].i === 0, e = etapeDefi, dernier = e >= DEFIS.length - 1;
      let info;
      if (gagne && dernier) { etapeDefi = 0; $('gagnant').textContent = 'GRANDE CHAMPIONNE !'; lab($('gagnant'), 'Grande championne'); info = 'Tu as battu tous les adversaires du défi.'; vocal = ' Bravo ! Tu es la grande championne !'; }
      else if (gagne) { etapeDefi++; defiSuite = true; info = 'Étape ' + (e + 1) + ' réussie. Prochaine étape : ' + (e + 2) + ' sur ' + DEFIS.length + '.'; vocal = ' Étape réussie. Prochaine étape, ' + (e + 2) + ' sur ' + DEFIS.length + '.'; okb.textContent = 'Étape suivante'; lab(okb, 'Étape suivante'); }
      else { etapeDefi = 0; info = 'Perdu à l’étape ' + (e + 1) + '. Le défi recommence.'; vocal = ' Perdu. Le défi recommence.'; }
      sauverEtape();
      inf.textContent = info; lab(inf, info); inf.hidden = false;
    }
    show('fin');
    focusSilencieux($('ok-fin'));
    jouer(sonVictoire);
    await attendre(3600);
    if (!vivant(tk)) return;
    await dire('Fin de la partie. ' + l.map(function (x) { return x.n + ', ' + nombre(x.s) + ' points.'; }).join(' ') + ' ' + l[0].n + ' a gagné !' + vocal);
    G.busy = false;
  }

  /* =====================================================================
     ÉCRANS

  const VUES = ['accueil', 'partie', 'reglages', 'fin'];

    G.scores.fill(0); G.farkles.fill(0); G.cur = 0; G.dernier = null;

  const DEFIS = [['Débutant'], ['Intermédiaire'], ['Pro'], ['Débutant', 'Intermédiaire'], ['Intermédiaire', 'Pro'], ['Expert'], ['Pro', 'Expert']];
  let sauvegardeReg = null, enDefi = false;

    }

    n.innerHTML = 'NOUVELLE PARTIE<small>Mode ' + m + '</small>';

  async function demarrerPartie(intro) {
    abandonner();
    remiseAZero();
    G.enCours = true;
    show('partie');
    const tk = G.token;
    if (reg.joueurs.slice(0, reg.nb).some(function (p) { return p.type === 'robot' && (p.niveau === 'Pro' || p.niveau === 'Expert'); })) {
      setTimeout(prepDP, 0);
    }
    if (intro) {
      msg(intro);

  function lancerEtapeDefi() {
    if (!sauvegardeReg) sauvegardeReg = { nb: reg.nb, joueurs: reg.joueurs.map(function (p) { return { type: p.type, niveau: p.niveau, nom: p.nom }; }) };
    const adv = DEFIS[etapeDefi];
    reg.nb = 1 + adv.length;
    reg.joueurs[0].type = 'humain';
    adv.forEach(function (n, i) { reg.joueurs[i + 1].type = 'robot'; reg.joueurs[i + 1].niveau = n; reg.joueurs[i + 1].nom = ''; });
    enDefi = true;
    return demarrerPartie('Défi, étape ' + (etapeDefi + 1) + ' sur ' + DEFIS.length + ', contre ' + adv.map(affNiv).join(' et ') + '.');
  }
  function nouvellePartie() {
    try { if (!RAPIDE) ac(); } catch (e) { /* sans son */ }
    restaurerReg();
    if (reg.mode === 'defi') { lancerEtapeDefi().catch(function () { }); return; }
    demarrerPartie('').catch(function () { });
  }
  function retourAccueil() {

  function suiteFin() {
    if (enDefi && defiSuite) { defiSuite = false; lancerEtapeDefi().catch(function () { }); return; }

  let defiSuite = false;

  /* ---------- Paramètres ---------- */
  function btnReglage(id) {

    b.type = 'button'; b.className = 'btn reglage nav'; b.id = id;

  const rMode = btnReglage('r-mode'), rEtape = btnReglage('r-etape');
  const rNb = btnReglage('r-nb');

  for (let i = 0; i < 4; i++) {
    rType.push(btnReglage('r-type-' + i));
    rNom.push(btnReglage('r-nom-' + i));
    const inp = document.createElement('input');
    inp.type = 'text'; inp.id = 'r-in-' + i; inp.className = 'saisie nav'; inp.maxLength = 14; inp.hidden = true;
    inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocapitalize', 'words'); inp.placeholder = 'Joueur';
    $('r-liste').appendChild(inp);

  }
  const rVoix = btnReglage('r-voix');
  const rCadres = btnReglage('r-cadres');
  let edition = null;
  const MODE_TXT = { classique: 'Classique', defi: 'Défi' };
  function majReglages() {
    const defi = reg.mode === 'defi';
    rMode.textContent = 'Mode : ' + MODE_TXT[reg.mode];
    lab(rMode, 'Mode, ' + MODE_TXT[reg.mode].toLowerCase());
    rEtape.hidden = !(defi && etapeDefi > 0);
    rEtape.textContent = 'Recommencer le défi (étape ' + (etapeDefi + 1) + ')';
    lab(rEtape, 'Recommencer le défi depuis le début. Vous êtes à l’étape ' + (etapeDefi + 1));
    rNb.hidden = defi;
    rNb.textContent = 'Nombre de joueurs : ' + reg.nb;
    lab(rNb, 'Nombre de joueurs, ' + reg.nb);
    for (let i = 0; i < 4; i++) {
      const p = reg.joueurs[i], robot = p.type === 'robot';
      const absent = defi ? i > 0 : i >= reg.nb;
      rType[i].hidden = absent || (defi && i === 0);
      rType[i].textContent = 'Participant ' + (i + 1) + ' : ' + (robot ? 'Robot' : 'Humain');
      lab(rType[i], 'Participant ' + (i + 1) + ', ' + (robot ? 'robot' : 'humain'));
      rNom[i].hidden = absent || (robot && !defi) || edition === i;
      rNom[i].textContent = 'Nom : ' + nom(i);
      lab(rNom[i], 'Nom du participant ' + (i + 1) + ', ' + nom(i));
      rIn[i].hidden = edition !== i;
      lab(rIn[i], 'Nom du participant ' + (i + 1) + '. Saisissez le nom puis validez.');
      rNiv[i].hidden = absent || !robot || defi;
      rNiv[i].textContent = 'Niveau : ' + affNiv(p.niveau);
      lab(rNiv[i], 'Niveau du participant ' + (i + 1) + ', ' + affNiv(p.niveau).toLowerCase());
    }
    rVoix.textContent = 'Voix : ' + (reg.voix ? 'activée' : 'désactivée');
    lab(rVoix, 'Voix, ' + (reg.voix ? 'activée' : 'désactivée'));
    rCadres.textContent = 'Encadrés jaunes : ' + (reg.cadres ? 'activés' : 'désactivés');
    lab(rCadres, 'Encadrés jaunes, ' + (reg.cadres ? 'activés' : 'désactivés'));
    document.body.classList.toggle('sans-cadre', !reg.cadres);
  }
  function changer(el, fn, opt) {
    surClic(el, function () {
      fn();
      sauver();
      majReglages();
      dire(el.getAttribute('data-parle'), opt);
    });
  }
  changer(rMode, function () { reg.mode = reg.mode === 'defi' ? 'classique' : 'defi'; });
  surClic(rEtape, function () { etapeDefi = 0; sauverEtape(); majReglages(); dire('Défi remis au début.'); focusSilencieux(rMode); });
  changer(rNb, function () { reg.nb = reg.nb % 4 + 1; });
  for (let i = 0; i < 4; i++) {
    changer(rType[i], function () { reg.joueurs[i].type = reg.joueurs[i].type === 'robot' ? 'humain' : 'robot'; });
    changer(rNiv[i], function () { reg.joueurs[i].niveau = NIVEAUX[(NIVEAUX.indexOf(reg.joueurs[i].niveau) + 1) % NIVEAUX.length]; });
  }
  surClic(rVoix, function () {
    reg.voix = !reg.voix;
    sauver();
    majReglages();
    dire(rVoix.getAttribute('data-parle'), { force: true });
  });
  surClic(rCadres, function () {
    reg.cadres = !reg.cadres;
    sauver();
    majReglages();
    dire(rCadres.getAttribute('data-parle'));
  });
  function debutEdition(i) {
    edition = i;
    majReglages();
    rIn[i].value = reg.joueurs[i].nom || '';
    focusSilencieux(rIn[i]);
    try { rIn[i].select(); } catch (e) { /* rien */ }
    dire('Nom du participant ' + (i + 1) + '. Saisissez le nom puis validez.');
  }
  function finEdition(refocus) {
    if (edition === null) return;
    const i = edition;
    let v = rIn[i].value.replace(/\s+/g, ' ').trim().slice(0, 14);
    if (!v && i === 0) v = 'Vanessa';

  }
  for (let i = 0; i < 4; i++) {
    surClic(rNom[i], function () { debutEdition(i); });
    rIn[i].addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); finEdition(true); } });
    rIn[i].addEventListener('blur', function () { finEdition(false); });

  surClic($('nouvelle'), nouvellePartie);
  surClic($('engrenage'), ouvrirReglages);

  /* =====================================================================
     NAVIGATION AU CLAVIER (flèches + OK) ET LECTURE DE L'ÉLÉMENT ACTIF
     ===================================================================== */
  function navItems() {
    return Array.prototype.filter.call(document.querySelectorAll('.nav'), function (el) {
      return el.getClientRects().length > 0;
    });
  }
  document.addEventListener('focusin', function (e) {
    const el = e.target;
    if (!el.classList || !el.classList.contains('nav') || silence || lecteur()) return;
    dire(el.getAttribute('data-parle') || el.textContent.trim(), { court: true });
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const act = document.activeElement;
    if (act && act.tagName === 'INPUT' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    if (!e.repeat && (e.key === '4' || e.key === '5' || e.key === '6')) {
      e.preventDefault();
      raccourci(e.key === '4' ? 'lancer' : e.key === '6' ? 'stop' : 'params');
      return;
    }
    const items = navItems();
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (!items.length) return;
      if (i < 0) items[0].focus();
      else if (items[i].id === 'stop' && $('gobelet').getClientRects().length) $('gobelet').focus();
      else if (i >= items.length - 1) { jouer(sonButee); items[i].focus(); }
      else items[i + 1].focus();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      if (i <= 0) { jouer(sonButee); items[0].focus(); }
      else items[i - 1].focus();
    } else if ((e.key === 'Enter' || e.key === ' ') && i >= 0) {
      e.preventDefault();
      if (!e.repeat) items[i].click();
    }
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ') e.preventDefault(); });

  /* ---------- Raccourcis ---------- */
  function raccourci(nomR) {
    const vue = function (v) { return !$('v-' + v).hidden; };
    if (nomR === 'lancer') { if (vue('partie')) $('gobelet').click(); }
    else if (nomR === 'stop') { if (vue('partie')) $('stop').click(); }
    else if (nomR === 'params') {

      else if (vue('accueil') || vue('partie')) $('engrenage').click();

  /* ---------- Manette de jeu (Bluetooth ou USB) ----------
     Croix directionnelle ou joystick gauche = flèches. Boutons selon leur position (Retroid Pocket 5) : droite (A) = OK, bas (B) = retour sur Lancer, haut (X) = STOP, gauche (Y) = paramètres. Si l'appareil envoie déjà ces actions
     comme des touches du clavier, la manette n'ajoute rien (pas de double déplacement). */
  let touchePhys = 0;
  document.addEventListener('keydown', function (e) { if (e.isTrusted) touchePhys = Date.now(); }, true);
  const memManette = {};
  let boucleManette = false;
  function envoyerTouche(key) {
    const t0 = Date.now();
    setTimeout(function () {
      if (touchePhys >= t0 - 40) return;
      document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
    }, 80);
  }
  function lireManettes() {
    const liste = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let g = 0; g < liste.length; g++) {
      const gp = liste[g];
      if (!gp || !gp.connected) continue;
      const b = function (i) { return !!(gp.buttons[i] && gp.buttons[i].pressed); };
      const ax = gp.axes || [];
      const etat = {
        ArrowUp: b(12) || ax[1] < -0.6, ArrowDown: b(13) || ax[1] > 0.6,
        ArrowLeft: b(14) || ax[0] < -0.6, ArrowRight: b(15) || ax[0] > 0.6,
        Enter: b(1), Lancer: b(0), Stop: b(3), Params: b(2)
      };
      const mem = memManette[gp.index] || (memManette[gp.index] = {});
      Object.keys(etat).forEach(function (k) {
        if (etat[k] && !mem[k]) {
          if (k === 'Lancer') { const gob = $('gobelet'); if (gob.getClientRects().length) { gob.focus(); gob.click(); } }
          else if (k === 'Stop') raccourci('stop');
          else if (k === 'Params') raccourci('params');
          else envoyerTouche(k);
        }
        mem[k] = etat[k];
      });
    }
    requestAnimationFrame(lireManettes);
  }
  function demarrerManette() { if (!boucleManette) { boucleManette = true; requestAnimationFrame(lireManettes); } }
  window.addEventListener('gamepadconnected', demarrerManette);
  try { if (navigator.getGamepads && Array.prototype.some.call(navigator.getGamepads(), Boolean)) demarrerManette(); } catch (e) { /* rien */ }

  /* ---------- Démarrage ---------- */
  reconstruireScores();
  majReglages();
  majAccueil();
  show('accueil');
  try { if (!RAPIDE && natif()) ac(); } catch (e) { /* sans son */ }
  /* Avec un lecteur d'écran : on retire le rôle « bouton » pour qu'il ne répète pas « bouton » à chaque élément.
     Le clavier (flèches + OK) est géré par le jeu lui-même. */
  /* Lecteur d'écran : le lecteur parcourt les éléments dans l'ordre de la page. Un second « Lancer »,
     placé après STOP et superposé au vrai bouton, permet de passer de STOP à Lancer avec la flèche de droite. */
  let double = null;
  function placerDouble() {
    if (!double) return;
    const r = $('gobelet').getBoundingClientRect();
    double.style.left = r.left + 'px'; double.style.top = r.top + 'px';
    double.style.width = r.width + 'px'; double.style.height = r.height + 'px';
  }
  if (lecteur()) {
    double = document.createElement('button');
    double.type = 'button';
    double.tabIndex = -1;
    double.setAttribute('aria-label', 'Lancer');
    double.style.cssText = 'position:fixed;margin:0;padding:0;border:0;background:transparent;opacity:0;pointer-events:none;';
    $('v-partie').appendChild(double);
    surClic(double, function () { actionGobelet(); });
    window.addEventListener('resize', placerDouble);
    if (window.ResizeObserver) new ResizeObserver(placerDouble).observe($('gobelet'));
  }
  if (lecteur()) {
    Array.prototype.forEach.call(document.querySelectorAll('.nav'), function (el) {
      if (el.tagName !== 'INPUT') el.setAttribute('role', 'group');
    });
  }

  if (RAPIDE || window.__test) window.__farkle = { reg: reg, G: G, scoreOf: scoreOf, valide: valide, sousEnsembles: sousEnsembles, prepDP: prepDP, R: R, S: S, dice: dice, nom: nom };
})();
</script>
